name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Offline tests (the LLM is mocked, so no API keys are needed)
        run: pytest

  docker:
    # Builds the Module 07 image and checks that the container starts and answers /healthz.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t course-agent:ci modules/07-production-deploy/solution
      - name: Smoke test
        run: |
          docker run -d --name agent -p 8000:8000 -e SERVICE_API_KEY=ci-only-key course-agent:ci
          for i in $(seq 1 20); do curl -fsS localhost:8000/healthz && break; sleep 1; done
          curl -fsS localhost:8000/healthz
          test "$(docker exec agent id -u)" = "10001"
          docker rm -f agent
